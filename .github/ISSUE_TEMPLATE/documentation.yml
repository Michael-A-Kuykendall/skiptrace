name: Documentation
description: A doc is wrong, missing, or out of date
labels: ["documentation"]
body:
  - type: input
    id: where
    attributes:
      label: File or section
      placeholder: README.md, Profiles
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested text
      description: Optional. The docs have to match what the tool prints.
